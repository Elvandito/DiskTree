name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.DISKTREE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/disktree-release.p12"
            chmod 600 "$RUNNER_TEMP/disktree-release.p12"
            echo "Release signing key available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No signing key configured, release APK will be unsigned" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test, lint, and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
        env:
          DISKTREE_STORE_FILE: ${{ runner.temp }}/disktree-release.p12
          DISKTREE_STORE_PASSWORD: ${{ secrets.DISKTREE_STORE_PASSWORD }}
          DISKTREE_KEY_ALIAS: ${{ secrets.DISKTREE_KEY_ALIAS }}
          DISKTREE_KEY_PASSWORD: ${{ secrets.DISKTREE_KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DiskTree-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
